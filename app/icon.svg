<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!--
    ไอคอนบนแท็บเบราว์เซอร์ — ตราประทับ "เล่าไว้"
    ใช้ลายเดียวกับ components/Logo.tsx แต่ปรับให้อ่านออกที่ 16px

    สิ่งที่ต่างจากโลโก้ตัวเต็ม และเหตุผล:
    1. มีพื้นวงกลมทึบ    ถ้าปล่อยโปร่งใส ตราจะหายไปบนแถบแท็บสีเข้ม
    2. ตัดวงในบาง ๆ ออก  ที่ 16px เส้นหนา 0.8 จะกลายเป็นรอยเปื้อน
    3. เส้นทุกเส้นหนาขึ้น ของเดิมหนา 2.6 เมื่อย่อเหลือ 16px จะบางกว่า 1px
  -->
  <defs>
    <linearGradient id="g" x1="12" y1="12" x2="36" y2="36">
      <stop offset="0%" stop-color="#f0cd7c"/>
      <stop offset="55%" stop-color="#e3b254"/>
      <stop offset="100%" stop-color="#c9953a"/>
    </linearGradient>
  </defs>

  <!-- พื้นกระดาษ เพื่อให้เห็นตราทั้งบนแท็บสว่างและแท็บมืด -->
  <circle cx="24" cy="24" r="23.5" fill="#fdf8ef"/>

  <!-- วงแหวนตราประทับ -->
  <circle cx="24" cy="24" r="21" fill="none" stroke="url(#g)" stroke-width="3"/>

  <!-- คลื่นเสียง 5 แท่ง แท่งกลางสูงสุด -->
  <g stroke-linecap="round" fill="none">
    <path d="M13.5 24.5v-3.5" stroke="#211a12" stroke-width="3.2" opacity="0.5"/>
    <path d="M18.8 27.5v-9"   stroke="#211a12" stroke-width="3.4" opacity="0.75"/>
    <path d="M24 31v-16"      stroke="url(#g)"  stroke-width="4"/>
    <path d="M29.2 27.5v-9"   stroke="#211a12" stroke-width="3.4" opacity="0.75"/>
    <path d="M34.5 24.5v-3.5" stroke="#211a12" stroke-width="3.2" opacity="0.5"/>
  </g>

  <!-- เส้นหน้ากระดาษที่คลื่นเสียงวางอยู่ -->
  <path d="M12.5 35c4.4-2.4 7.9-2.4 11.5 0 3.6 2.4 7.1 2.4 11.5 0"
        fill="none" stroke="url(#g)" stroke-width="2.6" stroke-linecap="round"/>
</svg>
